<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="tw_logo_d_grad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tw_logo_d_bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tw_watt_d_grad" x1="125" y1="18" x2="195" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="tw_logo_d_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mark Icon -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#tw_logo_d_bg)" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="14" stroke="#334155" stroke-width="0.8" stroke-dasharray="1.5 2.5" opacity="0.6"/>
    <circle cx="14" cy="14" r="2" fill="#38BDF8"/>
    <circle cx="34" cy="14" r="2" fill="#00E5FF"/>
    <circle cx="14" cy="34" r="2" fill="#059669"/>
    
    <path d="M14 14 H34 L24 24 V33" stroke="url(#tw_logo_d_grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#tw_logo_d_glow)"/>
    <path d="M16 33 L24 25 L32 33" stroke="url(#tw_logo_d_grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="24" cy="24" r="3.2" fill="#FFFFFF" filter="url(#tw_logo_d_glow)"/>
    <circle cx="24" cy="24" r="1.6" fill="#00E5FF"/>
    <circle cx="32" cy="33" r="2.2" fill="#10B981" filter="url(#tw_logo_d_glow)"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(56, 32)">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.6">
      <tspan fill="#F8FAFC">Trace</tspan><tspan fill="url(#tw_watt_d_grad)">Watt</tspan>
    </text>
  </g>
</svg>
