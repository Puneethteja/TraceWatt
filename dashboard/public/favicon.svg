<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tw_fav_bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tw_fav_trace" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tw_fav_glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="tw_glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Tile with Sleek Technical Bevel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tw_fav_bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tw_fav_glow)"/>

  <!-- Trace Grid Background Guides -->
  <circle cx="32" cy="32" r="20" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="32" cy="32" r="11" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Grid Nodes -->
  <circle cx="18" cy="18" r="2.5" fill="#38BDF8"/>
  <circle cx="46" cy="18" r="2.5" fill="#00E5FF"/>
  <circle cx="18" cy="46" r="2.5" fill="#059669"/>
  
  <!-- Active Trace Line (Interlocking T-W Energy Conduit) -->
  <path d="M18 18 H46 L32 32 L39 46 L32 39 L25 46 L32 32 L18 18Z" 
        fill="#00E5FF" fill-opacity="0.12"/>
  
  <path d="M18 18 H46 L32 32 V44" 
        stroke="url(#tw_fav_trace)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#tw_glow_filter)"/>
  
  <path d="M22 44 L32 34 L42 44" 
        stroke="url(#tw_fav_trace)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Pulse Focal Anomaly Detection Node -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" filter="url(#tw_glow_filter)"/>
  <circle cx="32" cy="32" r="2.2" fill="#00E5FF"/>
  <circle cx="42" cy="44" r="3" fill="#10B981" filter="url(#tw_glow_filter)"/>
</svg>